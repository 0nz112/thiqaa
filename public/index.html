<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>ثقة</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#06101D; --surface:#0C1A2C; --raised:#112238; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#E9EEF5; --muted:#93A1B5; --faint:#66758A;
  --green:#19B36B; --green-2:#3FD08C; --green-soft:rgba(25,179,107,.12); --green-line:rgba(25,179,107,.32);
  --task:#7CC4F5; --task-soft:rgba(124,196,245,.10); --task-line:rgba(124,196,245,.28);
  --warn:#E59A52; --warn-soft:rgba(229,154,82,.10);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;font-size:15px;line-height:1.6}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
main{max-width:560px;margin:0 auto;padding:16px 16px 24px}
h1{font-size:22px;margin:4px 0 12px;font-weight:700}
h2{font-size:16px;margin:22px 0 10px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero{background:linear-gradient(165deg,#0F2A22 0%,#0C1A2C 55%);border:1px solid var(--green-line);border-radius:22px;padding:20px}
.big{font-size:32px;font-weight:700;letter-spacing:.2px}
.cur{font-size:14px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.stat .l{font-size:12px;color:var(--muted)} .stat .v{font-size:18px;font-weight:700;margin-top:4px}
.pos{color:var(--green-2)} .neg{color:var(--warn)} .tsk{color:var(--task)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:1px solid transparent;font:inherit;font-weight:600;font-size:15px;cursor:pointer;padding:0 16px;text-decoration:none;width:100%}
.btn-primary{background:var(--green);color:#03140B}
.btn-primary:active{background:#14985A}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn-task{background:var(--task);color:#061624}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{min-height:40px;font-size:13.5px;border-radius:11px;width:auto}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;padding:6px 11px;border-radius:999px;font-size:12px;border:1px solid var(--line2);color:var(--muted);background:transparent;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--green-soft);border-color:var(--green-line);color:var(--green-2)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.badge{font-size:11px;padding:4px 9px;border-radius:7px;white-space:nowrap}
.b-ok{background:var(--green-soft);color:var(--green-2)} .b-wait{background:rgba(255,255,255,.07);color:#C8D1DD} .b-bad{background:var(--warn-soft);color:var(--warn)} .b-task{background:var(--task-soft);color:var(--task)}
.bar{height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li .grow{flex:1;min-width:0}
.li .t{font-size:14px;font-weight:500}
.ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#C3CDD9}
input,select,textarea{font:inherit;font-size:15px;color:var(--text);background:var(--raised);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{min-height:96px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#C3CDD9;line-height:1.7}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--green);flex-shrink:0}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:13px;font-size:12.5px;line-height:1.8}
.note-warn{background:var(--warn-soft);border:1px solid rgba(229,154,82,.28);color:#E8CDB5}
.note-info{background:var(--task-soft);border:1px solid var(--task-line);color:#CFE5F5}
.note-ok{background:var(--green-soft);border:1px solid var(--green-line);color:#C9EEDA}
.seg{display:flex;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);gap:4px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);font:inherit;font-size:13.5px;padding:9px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--raised);color:var(--text)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none} .kv span:first-child{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:none;font:inherit;font-size:14px;padding:8px 0;margin-bottom:4px;cursor:pointer}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:rgba(6,16,29,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);text-decoration:none;min-width:58px;padding:4px 0}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--green-2)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line2);padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.err{border-color:rgba(229,154,82,.5);color:#F2CDA9}
.sheet-bg{position:fixed;inset:0;background:rgba(2,6,12,.7);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:560px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.live{position:fixed;top:12px;left:12px;right:12px;max-width:520px;margin:0 auto;display:flex;gap:12px;align-items:center;background:var(--raised);border:1px solid var(--green-line);border-radius:14px;padding:11px 14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:13.5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green-2);flex-shrink:0}
.monthbars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.monthbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--faint)}
.monthbars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--green)}
.monthbars i.n{background:var(--warn)}
a{color:var(--green-2)}
:focus-visible{outline:2px solid var(--green-2);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main id="app"><div class="empty">جارٍ التحميل…</div></main>
<nav class="tabs" id="tabs"></nav>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#06101D'); tg.setBackgroundColor('#06101D'); } catch (e) {} }

// ---------------- أدوات ----------------
const $app = document.getElementById('app');
const fmt = (n) => Number(n || 0).toLocaleString('en-US');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, cls = '') => `<span class="num ${cls}">${fmt(n)}</span><span class="cur">د.ع</span>`;
const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const dateAr = (s) => s ? new Date(s.replace(' ', 'T') + 'Z').toLocaleDateString('ar-IQ', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const haptic = (t = 'light') => { try { tg?.HapticFeedback?.impactOccurred(t); } catch (e) {} };
const success = () => { try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (e) {} };

function toast(msg, err = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function api(path, opts = {}) {
  const headers = { 'X-Telegram-Init-Data': tg?.initData || '' };
  if (opts.json) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
  const res = await fetch('/api' + path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers, body: opts.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'تعذّر الاتصال بالخادم');
  return data;
}

const TX = {
  deposit: ['إيداع', 'b-wait'], withdraw: ['سحب', 'b-wait'], invest: ['استثمار', 'b-wait'], invest_return: ['استرداد استثمار', 'b-wait'],
  task_reward: ['مكافأة مهمة', 'b-task'], profit_settlement: ['أرباح', 'b-ok'], liquidation: ['تصفية حساب', 'b-wait'],
};
const STATUS = { completed: ['مكتملة', 'b-ok'], paid: ['تم التحويل', 'b-ok'], pending: ['قيد المراجعة', 'b-wait'], rejected: ['مرفوض', 'b-bad'] };
const KIND = { profit: 'سحب أرباح', liquidation: 'تصفية الحساب' };
const ACC = { zaincash: 'زين كاش', qicard: 'كي كارد', bank: 'حساب مصرفي', other: 'أخرى' };
const PSTATUS = { study: ['قيد الدراسة', 'b-wait'], open: ['مفتوح للاستثمار', 'b-ok'], active: ['نشط', 'b-task'], completed: ['مكتمل', 'b-wait'], closed: ['مغلق', 'b-bad'] };
const TSTATUS = { in_progress: ['قيد التنفيذ', 'b-task'], review: ['قيد المراجعة', 'b-wait'], accepted: ['مقبولة', 'b-ok'], rejected: ['مرفوضة', 'b-bad'] };
const badge = (map, k) => map[k] ? `<span class="badge ${map[k][1]}">${map[k][0]}</span>` : '';
const RISK = { 'منخفضة': 'pos', 'متوسطة': '', 'مرتفعة': 'neg' };

const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>',
  invest: '<path d="M4 19h16M6 15l4-4 3 3 6-7"/><path d="M15 7h4v4"/>',
  tasks: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',
  wallet: '<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>', list: '<path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/>',
  share: '<path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M12 3v12M7 8l5-5 5 5"/>',
  shield: '<path d="M12 3l8 3v6c0 4.5-3.4 7.8-8 9-4.6-1.2-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M12 11v5"/>',
  card: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M7 15h4"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/>',
  back: '<path d="M9 6l6 6-6 6"/>',
};
const svg = (k, size = 20, color = 'currentColor') => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

// ---------------- الحالة والتنقل ----------------
let ME = null;
async function loadMe() { ME = await api('/me'); return ME; }

const routes = {};
function go(hash) { location.hash = hash; }
window.addEventListener('hashchange', render);

function renderTabs(active) {
  const tabs = [['home', 'الرئيسية', '#/'], ['invest', 'الاستثمار', '#/invest'], ['tasks', 'المهام', '#/tasks'], ['wallet', 'المحفظة', '#/wallet'], ['user', 'حسابي', '#/profile']];
  if (ME?.isAdmin) tabs.push(['shield', 'الإدارة', '#/admin']);
  document.getElementById('tabs').innerHTML = tabs.map(([k, l, h]) =>
    `<a href="${h}" class="${active === k ? 'on' : ''}" aria-label="${l}">${svg(k, 22)}${l}</a>`).join('');
}

async function render() {
  const hash = location.hash.slice(1) || '/';
  const [, root, id, sub] = hash.split('/');
  const key = '/' + (root || '');
  const fn = routes[key] || routes['/'];
  if (!ME) { try { await loadMe(); } catch (e) {} }
  const isSub = !!id;
  if (tg?.BackButton) { isSub || ['/withdraw', '/transactions', '/reports', '/transparency', '/payouts', '/edit-profile'].includes(key) ? tg.BackButton.show() : tg.BackButton.hide(); }
  try {
    const html = await fn(id, sub);
    $app.innerHTML = `<div class="fade">${html}</div>`;
    window.scrollTo(0, 0);
    fn.after?.(id, sub);
  } catch (e) {
    $app.innerHTML = `<div class="empty">${esc(e.message)}<br><br><button class="btn btn-ghost btn-sm" onclick="render()">إعادة المحاولة</button></div>`;
  }
}
tg?.BackButton?.onClick(() => history.length > 1 ? history.back() : go('/'));
const backBtn = (to) => `<button class="back" onclick="${to ? `go('${to}')` : 'history.back()'}">${svg('back', 16)} رجوع</button>`;

// ---------------- التواصل مع الدعم ----------------
// يفتح محادثة حساب الدعم، مع رسالة جاهزة تُنسخ تلقائياً ليلصقها العضو
function contactSupport(message) {
  haptic();
  const link = ME?.config?.support;
  if (!link) return toast('لم يُحدَّد حساب الدعم بعد، تواصل مع الإدارة', true);
  navigator.clipboard?.writeText(message).catch(() => {});
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet stack" role="dialog" aria-label="التواصل مع الدعم">
    <div style="font-size:18px;font-weight:700">التواصل مع الدعم</div>
    <p class="small muted" style="line-height:1.8">نسخنا لك هذه الرسالة. الصقها في محادثة الدعم وأرسلها، وسيكمل الفريق العملية معك.</p>
    <div class="card" style="background:var(--raised);white-space:pre-line;font-size:13.5px;line-height:1.8">${esc(message)}</div>
    <button class="btn btn-primary" id="spGo">فتح محادثة الدعم</button>
    <button class="btn btn-ghost" id="spNo">إغلاق</button>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#spNo').onclick = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
  bg.querySelector('#spGo').onclick = () => { tg?.openTelegramLink ? tg.openTelegramLink(link) : window.open(link); bg.remove(); };
}

function depositSupport() {
  const u = ME.user;
  contactSupport(`مرحباً، أريد إيداع مبلغ في حسابي على منصة ثقة.\nالاسم: ${u.name}\nرقم العضوية: ${u.id}\nالمبلغ: `);
}

// ---------------- الرئيسية ----------------
routes['/'] = async () => {
  renderTabs('home');
  const { user, balance: b, referral, config } = await loadMe();
  const total = b.available + b.pending + b.invested;
  const pct = (x) => total ? (x / total * 100) : 0;
  return `
  <div class="row" style="margin-bottom:14px">
    <div><div class="small muted">مرحباً،</div><div style="font-size:18px;font-weight:600">${esc(user.name || 'مستخدم')}</div></div>
    ${user.profileComplete ? '<span class="badge b-ok">الملف مكتمل</span>' : '<a href="#/edit-profile" class="badge b-bad" style="text-decoration:none">أكمل ملفك</a>'}
  </div>

  <section class="hero">
    <div class="small muted">إجمالي قيمة الحساب</div>
    <div class="big" style="margin-top:4px">${money(total)}</div>
    <div class="bar" style="margin-top:16px" aria-hidden="true">
      <span style="width:${pct(b.invested)}%;background:var(--green)"></span>
      <span style="width:${pct(b.available)}%;background:#5E6E86"></span>
      <span style="width:${pct(b.pending)}%;background:#C8D1DD"></span>
    </div>
    <div class="row small" style="margin-top:8px;flex-wrap:wrap;justify-content:flex-start;gap:14px">
      <span><span style="color:var(--green-2)">■</span> مستثمر</span><span><span style="color:#5E6E86">■</span> متاح</span><span><span style="color:#C8D1DD">■</span> معلّق</span>
    </div>
    <div class="actions">
      <button class="btn btn-primary btn-sm" style="width:100%" onclick="depositSupport()">${svg('plus', 18)} إيداع</button>
      <a class="btn btn-ghost btn-sm" href="#/withdraw/profit">${svg('minus', 18)} سحب أرباح</a>
      <a class="btn btn-ghost btn-sm" href="#/wallet">${svg('wallet', 18)} المحفظة</a>
    </div>
  </section>
  ${!user.profileComplete ? `<a href="#/edit-profile" class="note note-warn" style="margin-top:10px;text-decoration:none">${svg('user', 18, '#E59A52')}<span>أكمل ملفك الشخصي (الاسم الثلاثي، رقم الهاتف، رقم الحساب) لتتمكن من طلب السحب. اضغط هنا.</span></a>` : ''}

  <div class="grid2" style="margin-top:10px">
    <div class="card stat"><div class="l">الرصيد القابل للسحب</div><div class="v">${money(b.available)}</div></div>
    <div class="card stat"><div class="l">قيمة الاستثمارات الحالية</div><div class="v">${money(b.invested)}</div></div>
    <div class="card stat"><div class="l">الأرباح المحققة</div><div class="v ${b.realized_profit >= 0 ? 'pos' : 'neg'}"><span class="num">${signed(b.realized_profit)}</span></div><div class="small faint">من الاستثمار فقط</div></div>
    <div class="card stat"><div class="l">مكافآت المهام</div><div class="v tsk"><span class="num">${fmt(b.task_earnings)}</span></div><div class="small faint">من عمل منجز</div></div>
  </div>

  <h2>ادعُ أصدقاءك</h2>
  <div class="card stack">
    <p class="small muted">شارك رسالة تعريفية مع رابط الإحالة الخاص بك، واختر بنفسك المحادثات التي تريد إرسالها إليها.</p>
    <div class="row small"><span class="muted">المسجّلون عبر رابطك</span><b class="num">${referral.count}</b></div>
    <button class="btn btn-primary" onclick="shareReferral()">${svg('share', 18)} مشاركة مع جهات الاتصال</button>
  </div>

  <a href="#/payouts" class="card row" style="margin-top:10px;text-decoration:none;color:var(--text)">
    <span style="display:flex;gap:10px;align-items:center"><span class="dot"></span> سحوبات الأعضاء المنفّذة</span>${svg('back', 16)}
  </a>
  <a href="#/transparency" class="card row" style="margin-top:10px;text-decoration:none;color:var(--text)">
    <span style="display:flex;gap:10px;align-items:center">${svg('info', 20, '#3FD08C')} كيف تحقق المنصة الإيرادات؟</span>${svg('back', 16)}
  </a>
  ${config.license ? `<p class="small faint" style="text-align:center;margin-top:16px">${esc(config.license)}</p>` : ''}`;
};

function shareReferral() {
  haptic();
  if (tg?.switchInlineQuery) {
    try { tg.switchInlineQuery('', ['users', 'groups', 'channels']); return; } catch (e) {}
  }
  const url = `https://t.me/share/url?url=${encodeURIComponent(ME.referral.link)}&text=${encodeURIComponent(ME.referral.text.replace(ME.referral.link, ''))}`;

}

function openInvestSheet() {
  const p = window.__project;
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet stack" role="dialog" aria-label="تأكيد الاستثمار">
    <div style="font-size:18px;font-weight:700">تأكيد الاستثمار</div>
    <p class="muted small" id="invTxt">أدخل المبلغ الذي تريد تخصيصه لهذا المشروع.</p>
    <label class="f">المبلغ (د.ع)<input id="invAmt" inputmode="numeric" placeholder="${fmt(p.min_amount)}"></label>
    <div class="small faint">المتاح: ${fmt(ME.balance.available)} د.ع · الحد الأدنى ${fmt(p.min_amount)} د.ع</div>
    <div class="card" style="background:var(--raised)">
      <div class="kv"><span>المدة</span><span>${p.duration_days} يوماً</span></div>
      <div class="kv"><span>احتساب الأرباح</span><span style="text-align:left;max-width:60%">${esc(p.return_method)}</span></div>
      <div class="kv"><span>المخاطر</span><span>${esc(p.risk_level)}</span></div>
      <div class="kv"><span>الاسترداد المبكر</span><span>غير متاح قبل نهاية المدة</span></div>
    </div>
    <div class="note note-warn">العائد غير مضمون. قد يكون المبلغ المسترد أقل من المبلغ المستثمر إذا حقق المشروع خسارة.</div>
    <label class="check"><input type="checkbox" id="invOk"> قرأت شروط المشروع وأفهم مخاطره</label>
    <div class="grid2"><button class="btn btn-primary" id="invGo">تأكيد الاستثمار</button><button class="btn btn-ghost" id="invNo">إلغاء</button></div>
  </div>`;
  document.body.appendChild(bg);
  const amt = bg.querySelector('#invAmt');
  amt.addEventListener('input', () => {
    const v = Number(amt.value.replace(/\D/g, ''));
    amt.value = v ? fmt(v) : '';
    bg.querySelector('#invTxt').innerHTML = v ? `أنت على وشك تخصيص مبلغ <b class="num">${fmt(v)}</b> د.ع لهذا المشروع.` : 'أدخل المبلغ الذي تريد تخصيصه لهذا المشروع.';
  });
  bg.querySelector('#invNo').onclick = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
  bg.querySelector('#invGo').onclick = async (e) => {
    const v = Number(amt.value.replace(/\D/g, ''));
    if (!bg.querySelector('#invOk').checked) return toast('يجب الموافقة على الشروط والمخاطر', true);
    e.target.disabled = true;
    try {
      await api(`/projects/${p.id}/invest`, { json: { amount: v, accept_risk: true } });
      success(); bg.remove(); toast('تم تأكيد الاستثمار'); go('/invest');
    } catch (err) { toast(err.message, true); e.target.disabled = false; }
  };
}

function taskDetail(t) {
  if (!t) return '<div class="empty">المهمة غير موجودة</div>';
  const st = t.my_status;
  let action = '';
  if (!st) action = `<button class="btn btn-task" onclick="startTask(${t.id})">ابدأ المهمة</button>`;
  else if (st === 'in_progress') action = `
    <div class="card stack">
      <div style="font-weight:600">تسليم المهمة</div>
      <label class="f">وصف ما أنجزته / رابط العمل<textarea id="pText" placeholder="اكتب تفاصيل التسليم"></textarea></label>
      <label class="f">ملف الإثبات (صورة، PDF أو CSV حتى 10MB)<input type="file" id="pFile" accept="image/*,.pdf,.csv"></label>
      <button class="btn btn-task" id="pGo" onclick="submitTask(${t.id})">إرسال المهمة للمراجعة</button>
    </div>`;
  else if (st === 'review') action = `<div class="note note-info">المهمة قيد المراجعة. سيصلك إشعار في البوت عند صدور القرار.</div>`;
  else if (st === 'accepted') action = `<div class="note note-ok">تمت إضافة مكافأة المهمة إلى رصيدك.</div>`;
  else action = `<div class="note note-warn">لم تُقبل هذه المهمة. راجع المتطلبات في المهام القادمة.</div>`;
  return `${backBtn('/tasks')}
    <div class="small faint">مهمة رقم ${t.id}</div>
    <h1 style="margin-top:2px">${esc(t.title)}</h1>
    <div class="grid3" style="margin-bottom:10px">
      <div class="card stat" style="border-color:var(--task-line)"><div class="l">المكافأة</div><div class="v tsk num">${fmt(t.reward)}</div></div>
      <div class="card stat"><div class="l">المدة</div><div class="v">${t.duration_hours}س</div></div>
      <div class="card stat"><div class="l">الحالة</div><div style="margin-top:6px">${st ? badge(TSTATUS, st) : '<span class="badge b-ok">متاحة</span>'}</div></div>
    </div>
    <div class="card stack">
      <div><div style="font-weight:600;font-size:14px">المطلوب</div><p class="small muted" style="line-height:1.8;margin-top:4px">${esc(t.description)}</p></div>
      ${t.requirements ? `<div><div style="font-weight:600;font-size:14px">المتطلبات</div><p class="small muted" style="line-height:1.8;margin-top:4px">${esc(t.requirements)}</p></div>` : ''}
      ${t.proof_required ? `<div><div style="font-weight:600;font-size:14px">الإثبات المطلوب</div><p class="small muted" style="margin-top:4px">${esc(t.proof_required)}</p></div>` : ''}
    </div>
    <div style="margin-top:14px">${action}</div>`;
}

async function startTask(id) {
  try { await api(`/tasks/${id}/start`, { method: 'POST' }); haptic(); render(); }
  catch (e) { toast(e.message, true); }
}
async function submitTask(id) {
  const btn = document.getElementById('pGo');
  const fd = new FormData();
  fd.append('proof_text', document.getElementById('pText').value);
  const f = document.getElementById('pFile').files[0];
  if (f) fd.append('proof', f);
  btn.disabled = true;
  try { await api(`/tasks/${id}/submit`, { body: fd }); success(); toast('تم إرسال المهمة للمراجعة'); render(); }
  catch (e) { toast(e.message, true); btn.disabled = false; }
}

function formSheet(title, fieldsHtml, submitLabel, onSubmit) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = `<form class="sheet stack" role="dialog" aria-label="${esc(title)}">
    <div style="font-size:18px;font-weight:700">${title}</div>${fieldsHtml}
    <div class="grid2"><button class="btn btn-primary" type="submit">${submitLabel}</button><button class="btn btn-ghost" type="button" data-x>إلغاء</button></div>
  </form>`;
  document.body.appendChild(bg);
  bg.querySelector('[data-x]').onclick = () => bg.remove();
  bg.addEventListener('click', (e) => { if (e.target === bg) bg.remove(); });
  bg.querySelector('form').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('[type=submit]');
    btn.disabled = true;
    try { await onSubmit(new FormData(e.target)); bg.remove(); success(); render(); }
    catch (err) { toast(err.message, true); btn.disabled = false; }
  };
  bg.querySelector('input,select,textarea')?.focus();
}

function timeAgo(s) {
  if (!s) return '';
  const sec = Math.max(0, (Date.now() - new Date(s.replace(' ', 'T') + 'Z')) / 1000);
  if (sec < 60) return 'الآن';
  if (sec < 3600) return `قبل ${Math.floor(sec / 60)} دقيقة`;
  if (sec < 86400) return `قبل ${Math.floor(sec / 3600)} ساعة`;
  return dateAr(s);
}

    if (!items.length) return;
    if (!initial && lastPayoutAt) showLivePayout(items[0]);
    if (items[0].at > lastPayoutAt) lastPayoutAt = items[0].at;
  } catch (e) {}
}
function showLivePayout(i) {
  document.querySelector('.live')?.remove();
  const el = document.createElement('a');
  el.className = 'live fade';
  el.href = '#/payouts';
  el.style.textDecoration = 'none'; el.style.color = 'var(--text)';
  el.innerHTML = `<span class="dot"></span><span style="flex:1">${esc(i.name)} سحب <b class="num pos">${fmt(i.amount)}</b> د.ع${METHOD[i.method] ? ' عبر ' + METHOD[i.method] : ''}${i.source ? ' (' + esc(i.source) + ')' : ''}</span>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 6000);
}

// ---------------- بدء التشغيل ----------------
if (!tg?.initData) {
  $app.innerHTML = '<div class="empty" style="padding-top:80px">افتح المنصة من داخل بوت تيليغرام.</div>';
} else {
  render();
  checkPayouts(true);
  setInterval(() => { if (!document.hidden) checkPayouts(); }, 30000);
}
</script>
</body>
</html>
